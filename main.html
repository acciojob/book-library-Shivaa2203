<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Library</title>

<style>

body{
    margin: 0;
    background-color: #f8f8f8;
    font-family: Arial, sans-serif;
}

h1{
    text-align: center;
}

.book-library{

    background-color: #ffffff;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 30px;

    padding: 20px;
}

.book{

    width: 90%;

    background-color: white;

    padding: 20px;

    display: flex;

    flex-direction: column;

    align-items: center;
}

.book img{

    width: 220px;

    height: 320px;

    object-fit: cover;
}

.book h2{

    width: 100%;

    text-align: left;

    margin-top: 15px;
}

.author{

    width: 100%;

    text-align: left;

    color: #777777;

    margin-top: -10px;
}

.price{

    width: 95%;

    background-color: #2ecc71;

    color: white;

    text-align: center;

    padding: 15px;

    font-weight: bold;

    margin-top: 20px;
}

</style>
</head>

<body>

<h1>Book Library</h1>

<div class="book-library">

    <div class="book">

        <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Spy-in-the-Amber-by-Manohar-Malgonkar.jpg">

        <h2>SPY IN THE AMBER</h2>

        <p class="author">
            by Manohar Malgonkar
        </p>

        <div class="price">
            Rs. 299
        </div>

    </div>

    <div class="book">

        <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Sacred-Games-by-Vikram-Chandra.jpg">

        <h2>SACRED GAMES</h2>

        <p class="author">
            by Vikram Chandra
        </p>

        <div class="price">
            Rs. 199
        </div>

    </div>

    <div class="book">

        <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Byomkesh-Bakshi-by-Sharadindu-Bandyopadhyay.jpg">

        <h2>BYOMKESH BAKSHI</h2>

        <p class="author">
            by Sharadindu Bandyopadhyay
        </p>

        <div class="price">
            Rs. 249
        </div>

    </div>

</div>

</body>
</html>
