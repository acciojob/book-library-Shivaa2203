<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Library</title>

<style>

body{
    margin: 0;
    background-color: #f8f8f8;
    font-family: Arial, sans-serif;
}

.heading{
    text-align: center;
    background-color: white;
    padding: 20px;
    font-size: 35px;
    font-weight: bold;
}

.book-library{

    background-color: #ffffff;

    display: flex;
    flex-direction: column;

    align-items: center;

    gap: 40px;

    padding: 30px;
}

.book{

    width: 90%;

    background-color: white;

    padding: 20px;

    box-shadow: 0px 0px 10px rgba(0,0,0,0.1);

    display: flex;
    flex-direction: column;

    align-items: center;
}

.book img{

    width: 220px;
    height: 320px;

    object-fit: cover;
}

.details{

    width: 100%;

    margin-top: 15px;
}

.details h3{

    text-align: left;

    margin-bottom: 8px;
}

.author{

    text-align: left;

    color: #777777;
}

.price{

    width: 95%;

    background-color: #2ecc71;

    color: white;

    text-align: center;

    padding: 15px;

    margin-top: 20px;

    font-size: 18px;

    font-weight: bold;
}

</style>
</head>

<body>

<div class="heading">
    Book Library
</div>

<div class="book-library">

    <div class="book">

        <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Spy-in-the-Amber-by-Manohar-Malgonkar.jpg">

        <div class="details">
            <h3>SPY IN THE AMBER</h3>

            <p class="author">
                by Manohar Malgonkar
            </p>
        </div>

        <div class="price">
            Rs. 299
        </div>

    </div>

    <div class="book">

        <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Sacred-Games-by-Vikram-Chandra.jpg">

        <div class="details">
            <h3>SACRED GAMES</h3>

            <p class="author">
                by Vikram Chandra
            </p>
        </div>

        <div class="price">
            Rs. 199
        </div>

    </div>

    <div class="book">

        <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Byomkesh-Bakshi-by-Sharadindu-Bandyopadhyay.jpg">

        <div class="details">
            <h3>BYOMKESH BAKSHI</h3>

            <p class="author">
                by Sharadindu Bandyopadhyay
            </p>
        </div>

        <div class="price">
            Rs. 249
        </div>

    </div>

</div>

</body>
</html>
